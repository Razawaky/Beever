# Banco de dados para desenvolvimento local.
# A aplicação em si roda fora do compose nesta fase; o Dockerfile multi-stage
# entra na fase de deploy.
services:
  mysql:
    image: mysql:8.4
    container_name: beever-mysql
    restart: unless-stopped
    # A migration 008 cria os gatilhos que tornam audit_logs append-only
    # (RNF-17). Com log binário ligado, criar gatilho exige SUPER — que o
    # usuário da aplicação não tem e não deve ter. Esta variável permite que o
    # dono do banco crie os seus próprios gatilhos sem virar superusuário.
    command: ['--log-bin-trust-function-creators=1']
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-beever}
      MYSQL_USER: ${DB_USER:-beever}
      MYSQL_PASSWORD: ${DB_PASSWORD:-beever}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - beever-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD:-root}']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  beever-mysql-data:
