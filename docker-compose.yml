# Banco de dados para desenvolvimento local.
# A aplicação em si roda fora do compose nesta fase; o Dockerfile multi-stage
# entra na fase de deploy.
services:
  mysql:
    image: mysql:8.4
    container_name: beever-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-beever}
      MYSQL_USER: ${DB_USER:-beever}
      MYSQL_PASSWORD: ${DB_PASSWORD:-beever}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - beever-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD:-root}']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  beever-mysql-data:
