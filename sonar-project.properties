# Configuração da análise de qualidade — SonarQube.
#
# Fica versionada de propósito: a análise precisa ser reproduzível por qualquer
# pessoa que clone o repositório. Configuração fora do repositório seria
# configuração que só existe na máquina de quem montou a prova.

# Identidade do projeto no painel. A key é estável entre execuções: é ela que
# amarra a segunda análise (depois da correção) ao histórico da primeira, e é
# por isso que a comparação antes/depois funciona.
sonar.projectKey=beever
sonar.projectName=Beever

# Código de produção: o que o jogador vê e o que a aplicação faz.
sonar.sources=src,scripts

# Testes entram como pasta separada, não como fonte. O SonarQube mede cobertura
# de teste separadamente de linha de produção, e isso muda a leitura das
# métricas: um arquivo de teste não deve contar como "código coberto".
sonar.tests=test

# Biblioteca de terceiro já minificada. Analisar `lenis.min.js` só gera ruído:
# os problemas dela não são do Beever e poluiriam o painel com achados que
# ninguém do grupo pode corrigir.
sonar.exclusions=**/public/js/vendor/**

# Templates EJS não são JavaScript analisável.
sonar.coverage.exclusions=**/views/**

# COBERTURA: propositalmente não alimentada.
#
# O projeto já mede a própria cobertura, e mede do jeito dele: `npm run
# test:cobertura` usa o reporter nativo do Node 22
# (`--experimental-test-coverage`), que imprime **texto no console** e não
# produz um `lcov.info`. Apontar `sonar.javascript.lcov.reportPaths` para um
# arquivo que o projeto não gera faria o painel mostrar "0% — sem relatório",
# que é pior que não medir: parece um número ruim onde na verdade é um número
# ausente.
#
# A régua de cobertura que vale para o Beever é a da RNF-28 (100% de linha nos
# services de cálculo, ver `docs/15-COBERTURA-DE-TESTES.md`), e ela é aplicada
# pelo próprio `npm run test:cobertura`, que reprova o build. O SonarQube entra
# como segunda opinião de código, não como um portão de cobertura duplicado —
# e a máquina de 5,7 GB não tem folga para rodar a suíte de banco mais uma vez
# só para gerar um arquivo que ninguém do grupo pediu.
#
# Se o grupo quiser a cobertura no painel depois, o caminho é rodar a suíte com
# `--test-reporter=lcov --test-reporter-destination=coverage/lcov.info` e
# descomentar a linha abaixo. É uma decisão de escopo, não um acidente.
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Portão: a pipeline só passa se o Quality Gate passar.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300